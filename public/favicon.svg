<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Warm Alabaster Background -->
  <rect width="32" height="32" fill="#f4f0eb"/>

  <!-- Outer Editorial Border (Sharp, 0px border-radius) -->
  <rect x="3" y="3" width="26" height="26" stroke="#1c1e22" stroke-width="1.5" fill="none"/>

  <!-- Light Sepia Grid Line -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#e2ded9" stroke-width="1"/>
  <line x1="3" y1="16" x2="29" y2="16" stroke="#e2ded9" stroke-width="1"/>

  <!-- Terracotta Rust Woven Diamond -->
  <path d="M16 8l8 8-8 8-8-8z" stroke="#c96442" stroke-width="2" fill="none" stroke-linejoin="miter"/>

  <!-- Axis Threads (Obsidian Ink) -->
  <line x1="16" y1="3" x2="16" y2="10" stroke="#1c1e22" stroke-width="2"/>
  <line x1="16" y1="22" x2="16" y2="29" stroke="#1c1e22" stroke-width="2"/>
  <line x1="3" y1="16" x2="10" y2="16" stroke="#1c1e22" stroke-width="2"/>
  <line x1="22" y1="16" x2="29" y2="16" stroke="#1c1e22" stroke-width="2"/>

  <!-- Central Compass / Gate Core -->
  <circle cx="16" cy="16" r="4.5" fill="#f4f0eb" stroke="#c96442" stroke-width="1.5"/>
  <rect x="14.5" y="14.5" width="3" height="3" fill="#1c1e22" transform="rotate(45 16 16)"/>
</svg>
