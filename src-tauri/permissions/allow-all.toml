  "generate_speech",
  "load_plugins",
  "execute_plugin_hook",
  "load_settings",
  "save_settings",
  "test_provider_connection",
  "list_vaults",
  "create_vault",
  "switch_vault",
  "trash_note",
  "restore_note",
  "delete_trashed_note",
  "trash_folder",
  "save_canvas_file",
  "load_canvas_file",
  "list_folders",
  "list_templates",
  "delete_rules_folder",
  "delete_vault",
  "open_vault_dialog",
  "load_vault_settings",
  "save_vault_settings",
  "transcribe_speech",
  "reindex_vault",
  "convert_pdf_to_markdown",
  "save_session_memory",
  "list_session_memory",
  "delete_session_memory",
  "summarize_session",
  "list_sources",
  "save_source",
  "delete_source",
  "get_source",
  "capture_note",
  "clip_webpage",
  "get_world_manifest",
  "list_worlds",
  "create_world",
