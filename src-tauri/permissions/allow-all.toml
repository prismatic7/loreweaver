[[permission]]
identifier = "allow-all-commands"
description = "Allows all custom backend commands of the main application to be invoked by the frontend"
commands = { allow = [
  "greet",
  "load_notes",
  "load_trash_notes",
  "empty_trash",
  "save_note",
  "save_note_asset",
  "resolve_wiki_link",
  "load_rules",
  "save_rule",
  "delete_rule",
  "get_vault_path",
  "search_vault",
  "ingest_srd_text",
  "orchestrate_agent",
  "generate_image",
  "generate_speech",
  "load_plugins",
  "execute_plugin_hook",
  "load_settings",
  "save_settings",
  "test_provider_connection",
  "list_vaults",
  "create_vault",
  "switch_vault",
  "trash_note",
  "restore_note",
  "delete_trashed_note",
  "trash_folder",
  "save_canvas_file",
  "load_canvas_file",
  "list_folders",
  "list_templates",
  "delete_rules_folder",
  "delete_vault",
  "open_vault_dialog",
  "load_vault_settings",
  "save_vault_settings",
] }

